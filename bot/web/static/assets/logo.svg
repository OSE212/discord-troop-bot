<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#060E1A"/>
    </radialGradient>
    <filter id="glow-teal">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Gold outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C8952A" stroke-width="5" filter="url(#glow-gold)"/>

  <!-- Dark background fill -->
  <circle cx="100" cy="100" r="93" fill="url(#bg-grad)"/>

  <!-- Radar concentric rings -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#00E5CC" stroke-width="0.6" opacity="0.4"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#00E5CC" stroke-width="0.6" opacity="0.4"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#00E5CC" stroke-width="0.6" opacity="0.4"/>
  <circle cx="100" cy="100" r="17" fill="none" stroke="#00E5CC" stroke-width="0.6" opacity="0.4"/>

  <!-- Cross lines (radar grid) -->
  <line x1="100" y1="8" x2="100" y2="192" stroke="#00E5CC" stroke-width="0.8" opacity="0.55"/>
  <line x1="8" y1="100" x2="192" y2="100" stroke="#00E5CC" stroke-width="0.8" opacity="0.55"/>

  <!-- Diagonal lines -->
  <line x1="35" y1="35" x2="165" y2="165" stroke="#00E5CC" stroke-width="0.5" opacity="0.25"/>
  <line x1="165" y1="35" x2="35" y2="165" stroke="#00E5CC" stroke-width="0.5" opacity="0.25"/>

  <!-- Tick marks around inner ring (compass) -->
  <!-- North ticks -->
  <line x1="100" y1="14" x2="100" y2="22" stroke="#00E5CC" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="15" x2="86" y2="19" stroke="#00E5CC" stroke-width="0.8" opacity="0.35"/>
  <line x1="115" y1="15" x2="114" y2="19" stroke="#00E5CC" stroke-width="0.8" opacity="0.35"/>
  <!-- South ticks -->
  <line x1="100" y1="186" x2="100" y2="178" stroke="#00E5CC" stroke-width="1" opacity="0.5"/>
  <!-- East ticks -->
  <line x1="186" y1="100" x2="178" y2="100" stroke="#00E5CC" stroke-width="1" opacity="0.5"/>
  <!-- West ticks -->
  <line x1="14" y1="100" x2="22" y2="100" stroke="#00E5CC" stroke-width="1" opacity="0.5"/>

  <!-- Compass labels -->
  <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#00E5CC" opacity="0.7">N</text>
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#00E5CC" opacity="0.7">S</text>
  <text x="172" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#00E5CC" opacity="0.7">E</text>
  <text x="28" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#00E5CC" opacity="0.7">W</text>

  <!-- Three-armed center nexus (Y-shape) -->
  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="#00E5CC" filter="url(#glow-teal)"/>
  <!-- Arm to top (shield direction) -->
  <line x1="100" y1="100" x2="100" y2="58" stroke="#00E5CC" stroke-width="1.5" opacity="0.8"/>
  <!-- Arm to bottom-left (spear direction) -->
  <line x1="100" y1="100" x2="68" y2="130" stroke="#00E5CC" stroke-width="1.5" opacity="0.8"/>
  <!-- Arm to bottom-right (crosshair direction) -->
  <line x1="100" y1="100" x2="132" y2="130" stroke="#00E5CC" stroke-width="1.5" opacity="0.8"/>

  <!-- SHIELD (top, white) -->
  <g transform="translate(100, 44)" filter="url(#glow-teal)">
    <path d="M0,-14 L12,-8 L12,2 Q12,12 0,18 Q-12,12 -12,2 L-12,-8 Z"
          fill="white" opacity="0.92"/>
    <!-- Shield inner detail -->
    <path d="M0,-10 L8,-5 L8,1 Q8,8 0,13 Q-8,8 -8,1 L-8,-5 Z"
          fill="#BCD0E8" opacity="0.5"/>
  </g>

  <!-- SPEAR (bottom-left) -->
  <g transform="translate(68, 132)" filter="url(#glow-teal)">
    <!-- Spear tip (pointing upper-right) -->
    <polygon points="0,-14 -5,-2 5,-2" transform="rotate(-45)" fill="white" opacity="0.92"/>
    <!-- Spear shaft -->
    <line x1="3" y1="-3" x2="12" y2="6" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- CROSSHAIR / SCOPE (bottom-right, white) -->
  <g transform="translate(132, 132)" filter="url(#glow-teal)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="white" stroke-width="1.8" opacity="0.92"/>
    <!-- Cross lines inside -->
    <line x1="-11" y1="0" x2="-5" y2="0" stroke="white" stroke-width="1.5" opacity="0.92"/>
    <line x1="5" y1="0" x2="11" y2="0" stroke="white" stroke-width="1.5" opacity="0.92"/>
    <line x1="0" y1="-11" x2="0" y2="-5" stroke="white" stroke-width="1.5" opacity="0.92"/>
    <line x1="0" y1="5" x2="0" y2="11" stroke="white" stroke-width="1.5" opacity="0.92"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="white" opacity="0.92"/>
    <!-- Plus in center -->
    <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="1"/>
  </g>
</svg>
